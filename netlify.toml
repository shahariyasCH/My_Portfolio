[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  DATABASE_URL = "file:./prisma/dev.db"
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL"

[functions]
  included_files = ["prisma/dev.db"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
